spring:
  application:
    name: shorten-url-be
    server-url: https://ziplink.viethq.tech/
  datasource:
    url: jdbc:mysql://${QUALITY_DB_HOST}:3306/${QUALITY_DB}?allowPublicKeyRetrieval=true&useSSL=false
    username: ${QUALITY_DB_USERNAME}
    password: ${QUALITY_DB_PW}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

snowflake:
  data-center-id: 1
  worker-id: 1

server:
  error:
    whitelabel:
      enabled: false